version: 2.1
jobs:
  compile:
   docker:
      - image: nexgang/ubuntu:latest
   steps:
      - run:
          command: |
           git config --global user.name "${name}"
           git config --global user.email "${email}"
           git config --global color.ui false
           git clone --depth=1 https://github.com/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME} -b ${CIRCLE_BRANCH} .
           git submodule sync --recursive
           git submodule update --init --recursive --depth=1

      - restore_cache:
          key: clang-toolchain-v1-clang

      - run:
          name: Download clang toolchain
          command: |
           if [ ! -d clang ]; then
            git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang
           fi
           ./clang/bin/clang --version

      - save_cache:
          key: clang-toolchain-v1-clang
          paths:
            - clang

      - run:
          command: bash .circleci/build.sh

      - store_artifacts:
          path: zone_lavender/lavender.zip
          destination: lavender.zip

      - store_artifacts:
           path: log.txt
           destination: log.txt

workflows:
  version: 2.1
  cooking:
    jobs:
      - compile
